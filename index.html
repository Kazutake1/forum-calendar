<html lang="ja">

<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--large:#fee2e2;--mid:#dbeafe;--small:#dcfce7}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#f3f4f6;--muted:#9ca3af;--line:#30343b;--accent:#60a5fa;--large:#432323;--mid:#1d3350;--small:#1d3a29}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
header{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 10px} .bar{display:flex;gap:8px;align-items:center} button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:42px;padding:0 13px} #month{font-weight:800;flex:1;text-align:center}
main{padding:14px 12px calc(env(safe-area-inset-bottom) + 28px);max-width:900px;margin:auto} .filters{display:flex;gap:7px;overflow:auto;padding-bottom:10px} .chip.active{background:var(--accent);color:white;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px} .dow{font-size:11px;text-align:center;color:var(--muted);padding:5px} .day{min-width:0;min-height:88px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px;text-align:left;vertical-align:top} .day.blank{visibility:hidden} .num{font-weight:800;font-size:13px;margin-bottom:4px} .ev{font-size:9px;line-height:1.25;padding:3px 4px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .large{background:var(--large)} .mid{background:var(--mid)} .small{background:var(--small)} .today{outline:2px solid var(--accent)}
.detail{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px} .detail h2{font-size:18px;margin:0 0 8px} .item{padding:12px 0;border-top:1px solid var(--line)} .item:first-of-type{border-top:0} .title{font-weight:750} .meta{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.5} .note{color:var(--muted);font-size:11px;line-height:1.5;margin-top:12px}
@media(min-width:700px){.day{min-height:120px} .ev{font-size:11px}}
</style>
</head>
<body>
<header><h1>名古屋文理大学文化フォーラム</h1><div class="bar"><button id="prev">‹</button><div id="month"></div><button id="next">›</button><button id="now">今月</button></div></header>
<main>
<div class="filters"><button class="chip active" data-f="all">すべて</button><button class="chip" data-f="大ホール">大ホール</button><button class="chip" data-f="中ホール">中ホール</button><button class="chip" data-f="小ホール">小ホール</button></div>
<div id="calendar" class="grid"></div>
<section class="detail"><h2 id="dateTitle">日付を選択してください</h2><div id="details">日付をタップするとイベント詳細を表示します。</div></section>
<p class="note">公開情報をもとに作成した非公式カレンダーです。催事の変更・追加・非掲載があるため、来場前に公式情報をご確認ください。</p>
</main>

const cal=document.querySelector('#calendar'), ml=document.querySelector('#month'), dt=document.querySelector('#dateTitle'), det=document.querySelector('#details');

const cls=h=>h==='大ホール'?'large':h==='中ホール'?'mid':'small';
function list(k){return EVENTS.filter(e=>e.date===k&&(filter==='all'||e.hall===filter))}
function show(k){const [y,m,d]=k.split('-').map(Number), es=list(k);dt.textContent=`${y}年${m}月${d}日`;det.innerHTML=es.length?es.map(e=>`<div class="item"><div class="title">${e.title}</div><div class="meta">${e.hall}${e.time?' ・ '+e.time:''}${e.price?'<br>'+e.price:''}</div></div>`).join(''):'この日に登録されている公開イベントはありません。'}
function render(){const y=view.getFullYear(),m=view.getMonth();ml.textContent=`${y}年 ${m+1}月`;cal.innerHTML=['日','月','火','水','木','金','土'].map(x=>`<div class="dow">${x}</div>`).join('');const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const x=document.createElement('div');x.className='day blank';cal.appendChild(x)}for(let d=1;d<=days;d++){const k=key(y,m,d),es=list(k),b=document.createElement('button');b.className='day';b.type='button';const n=new Date();if(n.getFullYear()===y&&n.getMonth()===m&&n.getDate()===d)b.classList.add('today');b.innerHTML=`<div class="num">${d}</div>`+es.slice(0,3).map(e=>`<div class="ev ${cls(e.hall)}">${e.title}</div>`).join('')+(es.length>3?`<div class="ev">+${es.length-3}件</div>`:'');b.addEventListener('click',()=>show(k));cal.appendChild(b)}}
document.querySelector('#prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
document.querySelector('#next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
document.querySelector('#now').onclick=()=>{const n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);render();show(key(n.getFullYear(),n.getMonth(),n.getDate()))};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});
