    );
    await outAnim.finished;

    view=new Date(view.getFullYear(),view.getMonth()+delta,1);
    selected=null;
    renderCalendar();

    outAnim.cancel();

    const inAnim=pane.animate(
      [
        {transform:`translateX(${inX})`,opacity:.18},
        {transform:'translateX(0)',opacity:1}
      ],
      {duration:210,easing:'cubic-bezier(.22,.61,.36,1)',fill:'both'}
    );
    await inAnim.finished;
  }catch(e){
    view=new Date(view.getFullYear(),view.getMonth()+delta,1);
    selected=null;
    renderCalendar();
  }finally{
    monthAnimating=false;
  }
}
if(calendarEl&&window.PointerEvent){
  calendarEl.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    swipeId=e.pointerId;swipeStart={x:e.clientX,y:e.clientY,t:Date.now()};
  },{passive:true});
  calendarEl.addEventListener('pointerup',e=>{
    if(!swipeStart||e.pointerId!==swipeId)return;
    const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y,dt=Date.now()-swipeStart.t;
    swipeStart=null;swipeId=null;
    if(dt>900||Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.35)return;
    moveMonth(dx<0?1:-1);
  },{passive:true});
  calendarEl.addEventListener('pointercancel',()=>{swipeStart=null;swipeId=null},{passive:true});
}
let wheelLock=false;
if(calendarEl)calendarEl.addEventListener('wheel',e=>{
  if(wheelLock||monthAnimating||Math.abs(e.deltaX)<35||Math.abs(e.deltaX)<Math.abs(e.deltaY))return;
  wheelLock=true;moveMonth(e.deltaX>0?1:-1);
  setTimeout(()=>wheelLock=false,450);
},{passive:true});
$('#now').onclick=()=>{const n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);selected=key(n.getFullYear(),n.getMonth(),n.getDate());refresh()};
$$('.chip').forEach(b=>b.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;refresh()});
$$('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
search.oninput=()=>{query=search.value;clear.classList.toggle('hidden',!query);refresh();if(query)switchTab('list')};
clear.onclick=()=>{search.value='';query='';clear.classList.add('hidden');refresh();search.focus()};

const themeBtn=document.querySelector('#themeToggle');
let themeMode='system';
try{themeMode=localStorage.getItem('forum-theme')||'system'}catch(e){}
function applyTheme(mode){
  if(mode==='system')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',mode);
  if(themeBtn){
    themeBtn.dataset.mode=mode;
    themeBtn.textContent=mode==='system'?'自動':mode==='light'?'ライト':'ダーク';
  }
}
applyTheme(themeMode);
if(themeBtn)themeBtn.onclick=()=>{
  const order=['system','light','dark'];
  const cur=themeBtn.dataset.mode||'system';
  themeMode=order[(order.indexOf(cur)+1)%order.length];
  try{localStorage.setItem('forum-theme',themeMode)}catch(e){}
  applyTheme(themeMode);
};

async function loadAutoData(){
  try{
    const [er,mr]=await Promise.all([
      fetch('./events.json?ts='+Date.now(),{cache:'no-store'}),
      fetch('./update-meta.json?ts='+Date.now(),{cache:'no-store'})
    ]);
    if(er.ok){
      const data=await er.json();
      if(Array.isArray(data)&&data.length){
        EVENTS=data;
      }
    }
    if(mr.ok){
      const meta=await mr.json();
      const el=document.querySelector('#autoUpdated');
      if(el){
        const when=meta.updated_at_jst||meta.updated_at||'';
        const count=meta.event_count||EVENTS.length;
        if(meta.resolved_urls){
          if(meta.resolved_urls.events)URLS.events=meta.resolved_urls.events;
          if(meta.resolved_urls.schedule)URLS.schedule=meta.resolved_urls.schedule;
          const oe=document.querySelector('#officialEventsLink');
          const os=document.querySelector('#officialScheduleLink');
          if(oe)oe.href=URLS.events;
          if(os)os.href=URLS.schedule;
        }
        const note=meta.status==='ok'?'自動更新':'前回データを使用';
        let stale=false;
        const successAt=meta.last_successful_forum_at||meta.last_successful_source_at||meta.updated_at||'';
        if(successAt){
          const t=Date.parse(successAt);
          stale=!Number.isNaN(t)&&(Date.now()-t)>48*60*60*1000;
        }
        el.classList.toggle('stale',stale);
        el.textContent=stale?`⚠ 文化フォーラム公式情報の正常取得が48時間以上ありません ・ ${when} ・ ${count}件`:`${note}：${when} ・ ${count}件`;
      }
    }
  }catch(err){
    const el=document.querySelector('#autoUpdated');
    if(el)el.textContent='自動更新データを取得できないため保存済みデータを表示';
  }
  renderCalendar();renderList();
  const now=new Date();
  view=new Date(now.getFullYear(),now.getMonth(),1);
  showDate(key(now.getFullYear(),now.getMonth(),now.getDate()));
}
loadAutoData();
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).finally(()=>navigator.serviceWorker.register('./sw.js?v=929',{updateViaCache:'none'}));
}
</script>
