name: Verify event guide notice cleanup

on:
  push:
    branches:
      - fix-event-guide-notice-duplicates-20261001
    paths:
      - .github/workflows/verify-event-guide-notices.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-event-guide-notice-duplicates-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify syntax, filtering and duplicate identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import update_events as u

          for name in ('update_events.py','event_integrity.py','update_events_no_ocr.py'):
              compile(Path(name).read_text(encoding='utf-8'),name,'exec')

          assert u.is_non_event_guide_notice('「音楽三昧」合唱団員募集（申込受付中）')
          assert u.is_non_event_guide_notice('出演者募集')
          assert not u.is_non_event_guide_notice('ワンコインコンサートスペシャル 音楽三昧「ドイツ編」')
          assert not u.is_non_event_guide_notice('募集作品展')

          base={
              'date':'2027-03-22','hall':'その他','venues':['その他'],
              'time':'','title':'テストイベント','price':'','source':'event_guide',
              'official_url':'https://www.city.inazawa.aichi.jp/ica/0000002507.html'
          }
          richer={**base,'source_type':'city_schedule',
                  'source_url':'https://www.city.inazawa.aichi.jp/ica/0000002507.html',
                  'source_verified':True,'verified_fields':['date','title']}
          assert len(u.dedupe([base,richer]))==1, 'same source empty-time record must not accumulate'

          show1={**base,'time':'13:00〜','title':'同日同名公演'}
          show2={**base,'time':'17:00〜','title':'同日同名公演'}
          assert len(u.dedupe([show1,show2]))==2, 'different showtimes must stay separate'

          other_source={**base,'official_url':'https://example.com/event'}
          assert len(u.dedupe([base,other_source]))==2, 'different sources must not be merged only because time is empty'

          events=json.loads(Path('events.json').read_text(encoding='utf-8'))
          meta=json.loads(Path('update-meta.json').read_text(encoding='utf-8'))
          assert len(events)==79==meta['event_count']
          assert not any(u.is_stale_event_guide_notice(e) for e in events)
          march=[e for e in events if e.get('date')=='2027-03-22']
          assert len(march)==1, march
          assert march[0]['title']=='ワンコインコンサートスペシャル 音楽三昧「ドイツ編」'
          assert march[0]['hall']=='大ホール'
          assert len(u.dedupe(events))==len(events), 'new duplicate rule must not collapse unrelated saved events'

          live=u.parse_event_guide(u.DEFAULT_EVENT_GUIDE)
          assert not any(u.is_non_event_guide_notice(e.get('title','')) for e in live)
          print('PASS: recruitment notices excluded; exact same-source duplicates deduped; distinct showtimes preserved')
          print('live event guide rows after filter=',len(live))
          PY
      - name: Run production updater twice without OCR and verify no recurrence
        run: |
          python update_events_no_ocr.py
          cp events.json /tmp/events-first.json
          python update_events_no_ocr.py
          python - <<'PY'
          import json
          from pathlib import Path
          import update_events as u
          first=json.loads(Path('/tmp/events-first.json').read_text(encoding='utf-8'))
          second=json.loads(Path('events.json').read_text(encoding='utf-8'))
          for label,events in [('first',first),('second',second)]:
              assert not any(u.is_stale_event_guide_notice(e) for e in events), label
              march=[e for e in events if e.get('date')=='2027-03-22']
              assert len(march)==1, (label,march)
              assert march[0]['title']=='ワンコインコンサートスペシャル 音楽三昧「ドイツ編」'
          assert first==second, 'repeated updater run changed event records'
          print('PASS: production no-OCR updater is idempotent and recruitment notice does not return')
          PY
      - name: Diff hygiene
        run: |
          git diff --check
