name: Patch Theme Modes

on:
  push:
    branches:
      - remove-auto-theme-20260909
    paths:
      - patch_theme_modes.py
      - .github/workflows/patch-theme-modes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: remove-auto-theme-20260909
      - name: Patch theme modes
        run: python patch_theme_modes.py
      - name: Verify only requested theme changes
        run: |
          grep -q '>ライト</button>' index.html
          ! grep -q "themeMode='system'" index.html
          ! grep -q "const order=\['system','light','dark'\]" index.html
          ! grep -q 'prefers-color-scheme:dark' index.html
          git diff --check
          git diff -- index.html
      - name: Commit patch
        run: |
          git config user.name "forum-calendar-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove automatic theme mode"
          git push origin HEAD:remove-auto-theme-20260909
