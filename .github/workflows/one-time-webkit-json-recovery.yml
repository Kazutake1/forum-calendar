name: Fix interrupted manual JSON reads once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-webkit-json-recovery.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Patch interrupted-body recovery without modifying event data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main advanced; abort'; exit 1; }
          python - <<'PY'
          from pathlib import Path
          def once(text, before, after):
              assert text.count(before)==1, (before[:70],text.count(before))
              return text.replace(before,after)
          p=Path('manual-events.js'); text=p.read_text(encoding='utf-8')
          marker='  window.loadManualForumEvents = async () => {'
          assert text.count(marker)==1 and text.endswith('})();\n')
          text=text[:text.index(marker)]+'''  window.loadManualForumEvents = async () => {
            const status = document.querySelector('#autoUpdated');
            let stage = '取得';
            try {
              let manual, loaded = false, usingCache = false, lastError, lastStage = stage;
              // WebKit may resolve fetch() but fail while reading its response body.
              for (let attempt = 0; attempt < 2; attempt++) {
                try {
                  stage = '取得';
                  const response = await fetch(`./manual_events.json?ts=${Date.now()}-${attempt}`, { cache: 'no-store' });
                  if (!response.ok) throw new Error(`HTTP ${response.status}`);
                  stage = 'JSON解析';
                  manual = await response.json();
                  usingCache = Boolean(response.headers && response.headers.get &&
                    response.headers.get('X-Forum-Manual-Cache') === 'stale');
                  loaded = true;
                  break;
                } catch (error) {
                  lastError = error;
                  lastStage = stage;
                  if (attempt === 0) console.warn('手動イベントの応答を再取得します', error);
                }
              }
              if (!loaded) {
                try {
                  stage = '保存済みJSON解析';
                  const cached = window.caches && typeof window.caches.match === 'function'
                    ? await window.caches.match('./manual_events.json') : null;
                  if (cached && cached.ok) {
                    manual = await cached.json();
                    usingCache = true;
                    loaded = true;
                  }
                } catch (cacheError) {
                  console.warn('保存済み手動データの読み込みにも失敗しました', cacheError);
                }
              }
              if (!loaded) { stage = lastStage; throw lastError || new Error('手動データを取得できません'); }
              stage = '統合';
              const merged = merge(EVENTS, manual);
              const before = EVENTS;
              EVENTS = merged;
              stage = '表示';
              try { refresh(); } catch (error) { EVENTS = before; throw error; }
              if (usingCache && status) {
                status.classList.add('stale');
                status.textContent += ' ・ 手動登録：通信できないため保存済みデータを表示';
              }
            } catch (error) {
              console.error(`手動イベントの${stage}に失敗しました`, error);
              if (status) {
                const detail = String(error && error.message || '原因不明').slice(0, 100);
                status.classList.add('stale');
                status.textContent += ` ・ 手動登録データの${stage}失敗（${detail}）`;
              }
            }
          };
          })();
          '''
          p.write_text(text,encoding='utf-8')
          p=Path('sw.js'); text=p.read_text(encoding='utf-8')
          start='  if(isManual){'; end='  const isData=DATA_PATHS.some('
          assert text.count(start)==1 and text.count(end)==1
          i=text.index(start); j=text.index(end,i)
          text=text[:i]+'''  if(isManual){
            e.respondWith((async()=>{
              try {
                const response=await fetch(req,{cache:'no-store'});
                if(!response.ok||response.status!==200)return response;
                // Read the body once before returning it; do not race two cloned streams.
                const body=await response.text();
                if(!Array.isArray(JSON.parse(body)))throw new Error('手動イベントJSONは配列である必要があります');
                const headers={'Content-Type':'application/json; charset=utf-8'};
                try {
                  await (await caches.open(CACHE)).put(MANUAL_DATA,new Response(body,{status:200,headers}));
                } catch(cacheError) { console.warn('手動データのキャッシュ保存を省略',cacheError); }
                return new Response(body,{status:200,headers});
              } catch(error) {
                // Includes failures after fetch resolves but its response body is interrupted.
                try {
                  const cached=await caches.match(MANUAL_DATA);
                  if(cached&&cached.ok){
                    const body=await cached.text();
                    if(Array.isArray(JSON.parse(body)))return new Response(body,{status:200,headers:{
                      'Content-Type':'application/json; charset=utf-8',
                      'X-Forum-Manual-Cache':'stale'
                    }});
                  }
                } catch(cacheError) { console.warn('保存済み手動データも読み込めません',cacheError); }
                throw error;
              }
            })());
            return;
          }
          '''+text[j:]
          text=once(text,"const CACHE='forum-calendar-v9-3-5';","const CACHE='forum-calendar-v9-3-6';")
          p.write_text(text,encoding='utf-8')
          p=Path('index.html');text=p.read_text(encoding='utf-8')
          assert text.count('Ver.9.3.5')==2
          text=text.replace('Ver.9.3.5','Ver.9.3.6')
          text=once(text,'manual-events.js?v=935','manual-events.js?v=936')
          text=once(text,'sw.js?v=935','sw.js?v=936')
          p.write_text(text,encoding='utf-8')
          p=Path('CHANGELOG.md');text=p.read_text(encoding='utf-8')
          entry=('## Ver.9.3.6 — iOSの手動JSON本文読み込み障害対策（2026-09-20）\n'
                 '- fetch成功後のJSON本文取得失敗も含めて最大2回試行し、失敗時は保存済みデータを検査して利用。\n'
                 '- Service Workerで応答本文を一度だけ読み込んでから表示・保存し、クローンされたストリームの競合を回避。\n'
                 '- JSON本文の読み込み失敗とキャッシュ保存失敗を模擬した回帰テストを追加。イベントデータは変更しない。\n\n')
          text=once(text,'# 更新履歴\n\n','# 更新履歴\n\n'+entry)
          p.write_text(text,encoding='utf-8')
          p=Path('tests/test_manual_merge.cjs');text=p.read_text(encoding='utf-8')
          text=once(text,"  console.log('Manual recovery integration tests passed.');",'''  // iOS WebKit can report "Load failed" after fetch resolves, during response.json().
            let attempts = 0;
            const brokenBody = { ok: true, headers: { get: () => null },
              json: async () => { throw Error('Load failed'); } };
            const recovered = makePage(async () => (++attempts === 1 ? brokenBody : response), null);
            await recovered.page.window.loadManualForumEvents();
            assert.equal(attempts, 2);
            assert.equal(recovered.page.EVENTS.length, publishedMerged.length);
            assert.equal(recovered.getRefreshed(), 1);
            assert.ok(!recovered.status.textContent.includes('失敗'));

            const fromCache = makePage(async () => brokenBody, response);
            await fromCache.page.window.loadManualForumEvents();
            assert.equal(fromCache.page.EVENTS.length, publishedMerged.length);
            assert.equal(fromCache.getRefreshed(), 1);
            assert.ok(fromCache.status.textContent.includes('保存済みデータを表示'));

            const noBodyOrCache = makePage(async () => brokenBody, null);
            await noBodyOrCache.page.window.loadManualForumEvents();
            assert.equal(noBodyOrCache.page.EVENTS.length, publishedAuto.length);
            assert.ok(noBodyOrCache.status.textContent.includes('JSON解析失敗（Load failed）'));
            console.log('Manual recovery integration tests passed.');''')
          assert 'Service Worker interrupted-body regression tests passed.' not in text
          text+='''\n// Test the service worker response-body path, not just the page's fetch() mock.
          async function testManualServiceWorker() {
            const run = async (fetcher, cached, put) => {
              const listeners = {};
              const sw = vm.createContext({
                self: { location: { origin: 'https://calendar.example' },
                  addEventListener: (name, fn) => { listeners[name] = fn; } },
                URL, Response, Headers, console, fetch: fetcher,
                caches: { match: async () => cached, open: async () => ({ put }) }
              });
              vm.runInContext(fs.readFileSync('sw.js', 'utf8'), sw);
              let pending;
              listeners.fetch({ request: { method: 'GET',
                url: 'https://calendar.example/forum-calendar/manual_events.json?ts=1' },
                respondWith: p => { pending = p; } });
              assert.ok(pending, 'Manual request was not intercepted');
              return pending;
            };
            const cached = new Response(JSON.stringify(publishedManual), { status: 200 });
            const interrupted = { ok: true, status: 200,
              text: async () => { throw Error('Load failed'); } };
            let result = await run(async () => interrupted, cached, async () => {});
            assert.equal(result.headers.get('X-Forum-Manual-Cache'), 'stale');
            assert.equal((await result.json()).length, publishedManual.length);

            let key = '';
            result = await run(async () => new Response(JSON.stringify(publishedManual), { status: 200 }), null,
              async (path, value) => { key = path; assert.equal((await value.json()).length, publishedManual.length); });
            assert.equal(key, './manual_events.json');
            assert.equal((await result.json()).length, publishedManual.length);
            result = await run(async () => new Response(JSON.stringify(publishedManual), { status: 200 }), null,
              async () => { throw Error('cache quota'); });
            assert.equal((await result.json()).length, publishedManual.length);
            console.log('Service Worker interrupted-body regression tests passed.');
          }
          testManualServiceWorker().catch(e => { console.error(e); process.exitCode = 1; });
          '''
          p.write_text(text,encoding='utf-8')
          PY
      - name: Run all tests, syntax checks, and verify data preservation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          node tests/test_manual_merge.cjs
          node --check manual-events.js
          node --check sw.js
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          from update_events import load_required_events
          html=Path('index.html').read_text(encoding='utf-8')
          assert html.count('Ver.9.3.6')==2
          m=re.search(r'<script>\s*(.*?)\s*</script>',html,re.S)
          assert m
          Path('/tmp/forum-calendar-inline.js').write_text(m.group(1),encoding='utf-8')
          assert len(load_required_events(Path('events.json')))>0
          assert len(json.loads(Path('manual_events.json').read_text(encoding='utf-8')))==4
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'manual-events.js','sw.js','index.html','CHANGELOG.md','tests/test_manual_merge.cjs'}
          assert changed==expected,(changed,expected)
          PY
          node --check /tmp/forum-calendar-inline.js
          git diff --exit-code -- events.json manual_events.json
          git diff --check
      - name: Commit the tested code together
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main advanced; abort'; exit 1; }
          git config user.name 'forum-calendar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add manual-events.js sw.js index.html CHANGELOG.md tests/test_manual_merge.cjs
          git commit -m 'Recover interrupted iOS manual JSON reads (9.3.6)'
          git push origin HEAD:main
