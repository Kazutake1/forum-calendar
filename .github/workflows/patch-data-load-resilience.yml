name: Patch Data Load Resilience

on:
  push:
    branches:
      - fix-data-load-resilience-20260909
    paths:
      - patch_data_load_resilience.py
      - .github/workflows/patch-data-load-resilience.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-data-load-resilience-20260909

      - name: Patch independent data loading
        run: python patch_data_load_resilience.py

      - name: Verify requested change
        run: |
          grep -q 'Promise.allSettled' index.html
          grep -q 'eventsResult.status' index.html
          grep -q 'metaResult.status' index.html
          grep -q 'イベントデータを表示中（更新情報を取得できません）' index.html
          ! grep -q 'const \[er,mr\]=await Promise.all' index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          start=html.index('<script>')+len('<script>')
          end=html.rindex('</script>')
          Path('/tmp/forum-calendar.js').write_text(html[start:end],encoding='utf-8')
          PY
          node --check /tmp/forum-calendar.js
          git diff --check
          git diff -- index.html

      - name: Commit patch
        run: |
          git config user.name "forum-calendar-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Improve event data loading resilience"
          git push origin HEAD:fix-data-load-resilience-20260909
