name: Complete integrity verification and publish once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-priority-test-correction.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: complete-high-priority-integrity
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pyyaml
      - name: Apply unchanged reviewed patch; correct conflicting legacy test and prove safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          source=yaml.safe_load(Path('.github/workflows/one-time-priority-implementation.yml').read_text(encoding='utf-8'))
          steps=source['jobs']['apply']['steps']
          def command(prefix):
              matches=[step['run'] for step in steps if step.get('name','').startswith(prefix)]
              assert len(matches)==1, (prefix,len(matches))
              return matches[0]
          def execute(script): subprocess.run(['bash','-e','-o','pipefail','-c',script],check=True)
          execute(command('Patch application files'))
          path=Path('tests/test_event_integrity.py')
          text=path.read_text(encoding='utf-8')
          old='''        self.assertTrue(same_performance(event("", official_url="https://example.org/event"),
                                                   event("", official_url="https://example.org/event")))'''
          new='''        self.assertFalse(same_performance(event("", official_url="https://example.org/event"),
                                                    event("", official_url="https://example.org/event")))
                  self.assertTrue(same_performance(event("", performance_id="verified-show"),
                                                   event("", performance_id="verified-show")))'''
          assert text.count(old)==1, 'Legacy shared-URL test has changed'
          path.write_text(text.replace(old,new),encoding='utf-8')
          # Unknown legacy values may be scraped from city sources. A verified X post
          # cannot overwrite them without reviewer confirmation.
          path=Path('event_integrity.py');text=path.read_text(encoding='utf-8')
          old='if new and (not old or new_rank > old_rank):'
          new='if new and (not old or (new_rank > old_rank and not (old_rank == 0 and new_rank == 1))):'
          assert text.count(old)==1
          text=text.replace(old,new)
          old='if kind in {"event_official", "promoter", "organizer"} and info.get("event_specific") is True:'
          new='if (kind in {"event_official", "promoter", "organizer"} and info.get("event_specific") is True\n            and parsed.hostname not in {"x.com", "www.x.com", "twitter.com", "www.twitter.com"}):'
          assert text.count(old)==1
          path.write_text(text.replace(old,new),encoding='utf-8')
          path=Path('manual-events.js');text=path.read_text(encoding='utf-8')
          old="if(['event_official','organizer','promoter'].includes(kind)&&info.event_specific===true)return 3;"
          new="if(['event_official','organizer','promoter'].includes(kind)&&info.event_specific===true&&\n       !['x.com','www.x.com','twitter.com','www.twitter.com'].includes(url.hostname))return 3;"
          assert text.count(old)==1
          text=text.replace(old,new)
          old="if(!current[field]||b>a||(incoming.match&&corrected.includes(field)&&b>=a)){"
          new="if(!current[field]||(b>a&&!(a===0&&b===1))||(incoming.match&&corrected.includes(field)&&b>=a&&!(a===0&&b===1))){"
          assert text.count(old)==1
          path.write_text(text.replace(old,new),encoding='utf-8')
          # Extra regression: rank-1 X cannot silently alter an unverified legacy value.
          path=Path('tests/test_manual_merge.cjs');text=path.read_text(encoding='utf-8')
          text+='''\nresult=merge([base('開演18:00',{price:'500円'})], [manual('x-price','開演18:00',{price:'2000円',source_verified:true,verified_fields:['price']})]);\nassert.equal(result[0].price,'500円');\n'''
          path.write_text(text,encoding='utf-8')
          execute(command('Validate code'))
          execute(command('Commit only tested'))
          execute(command('Request Pages build'))
          PY
