                 '- 食い違いは根拠付きの明示的照合を必要とし、テストを追加。既存イベントデータは変更なし。\n\n')
          p.write_text(exact(s,'# 更新履歴\n\n','# 更新履歴\n\n'+entry),encoding='utf-8')
          PY
