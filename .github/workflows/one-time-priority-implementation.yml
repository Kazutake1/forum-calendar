name: Apply high-priority integrity fixes once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-priority-implementation.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: apply-high-priority-integrity
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Patch application files without touching event data or workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main changed; abort'; exit 1; }
          python - <<'PY'
          from pathlib import Path
          def exact(s,old,new,n=1):
              if s.count(old)!=n: raise RuntimeError(f'Unexpected exact anchor {old[:65]!r}: {s.count(old)}')
              return s.replace(old,new)
          def section(s,start,end,new):
              if s.count(start)!=1 or s.count(end)!=1 or s.index(end)<s.index(start):
                  raise RuntimeError(f'Unexpected section {start!r} to {end!r}')
              return s[:s.index(start)]+new+s[s.index(end):]
          p=Path('event_integrity.py'); s=p.read_text(encoding='utf-8')
          s=section(s,'def field_provenance(e: dict, field: str) -> dict:', 'def combine_performance(current: dict, incoming: dict) -> dict:', '''def field_provenance(e: dict, field: str) -> dict:
              stored = e.get("field_sources")
              if isinstance(stored, dict) and isinstance(stored.get(field), dict):
                  return dict(stored[field])
              kind = e.get(f"{field}_source_type") or e.get("source_type") or e.get("source") or "other"
              url = e.get(f"{field}_source_url") or e.get("source_url") or e.get("official_url") or ""
              verified = e.get(f"{field}_source_verified", e.get("source_verified", False)) is True
              allowed = e.get("verified_fields")
              if isinstance(allowed, list) and field not in allowed: verified = False
              specific = e.get(f"{field}_event_specific", e.get("event_specific", False)) is True
              return {"source_type": kind, "source_url": url, "verified": verified, "event_specific": specific}

          def source_rank(e: dict, field: str) -> int:
              """Verified field: event-specific official 3 > city schedule 2 > X 1."""
              info = field_provenance(e, field)
              if info.get("verified") is not True: return 0
              try:
                  parsed = urlparse(info.get("source_url") or "")
                  if parsed.scheme != "https" or not parsed.hostname: return 0
              except (TypeError, ValueError): return 0
              kind = str(info.get("source_type") or "")
              if kind in {"event_official", "promoter", "organizer"} and info.get("event_specific") is True:
                  return 3
              if parsed.hostname == CITY_HOST and kind in {"city_schedule", "city_official", *CITY_SOURCES}:
                  return 2
              if kind == "x" and parsed.hostname in {"x.com", "www.x.com", "twitter.com", "www.twitter.com"}:
                  return 1
              return 0

          def city_verified(e: dict, field: str) -> bool:
              info = field_provenance(e, field)
              try: host = urlparse(info.get("source_url") or "").hostname
              except (TypeError, ValueError): return False
              return host == CITY_HOST and source_rank(e, field) >= 2

          ''')
          s=section(s,'def combine_performance(current: dict, incoming: dict) -> dict:', '\n', '') if False else s
          start=s.index('def combine_performance(current: dict, incoming: dict) -> dict:')
          s=s[:start]+'''def combine_performance(current: dict, incoming: dict) -> dict:
              """Merge a *proven* single performance; keep conflicts for review."""
              merged = dict(current)
              evidence = dict(current.get("field_sources") or {})
              conflicts = list(current.get("review_conflicts") or [])
              for field in FIELDS:
                  old,new=current.get(field),incoming.get(field)
                  old_rank,new_rank=source_rank(current,field),source_rank(incoming,field)
                  if new and (not old or new_rank > old_rank):
                      merged[field]=new
                      evidence[field]=field_provenance(incoming,field)
                  elif old == new and new_rank > old_rank:
                      evidence[field]=field_provenance(incoming,field)
                  elif old and new and old != new and old_rank == new_rank and old_rank > 0:
                      conflict={"field":field,"existing":old,"incoming":new,"source_url":field_provenance(incoming,field).get("source_url","")}
                      if conflict not in conflicts: conflicts.append(conflict)
                  elif old and field not in evidence:
                      evidence[field]=field_provenance(current,field)
              # Door-opening time is distinct from the start time: retain both.
              starts_a,doors_a=time_parts(current.get("time"))
              starts_b,doors_b=time_parts(incoming.get("time"))
              if len(starts_a)==len(starts_b)==1 and starts_a==starts_b and (doors_a or doors_b):
                  chosen=doors_a or doors_b
                  if doors_a and doors_b and doors_a != doors_b:
                      chosen=doors_b if source_rank(incoming,"time")>source_rank(current,"time") else doors_a
                      if source_rank(incoming,"time")==source_rank(current,"time"):
                          conflict={"field":"opening_time","existing":doors_a,"incoming":doors_b}
                          if conflict not in conflicts: conflicts.append(conflict)
                  if len(chosen)==1:
                      merged["time"]=f"開場{chosen[0]}／開演{starts_a[0]}"
                      merged["opening_time_sources"]=[field_provenance(e,"time") for e in (current,incoming) if time_parts(e.get("time"))[1]]
              if merged.get("hall") != current.get("hall"):
                  merged["venues"]=incoming.get("venues") or [incoming["hall"]]
              if evidence: merged["field_sources"]=evidence
              if conflicts: merged["review_conflicts"]=conflicts
              for key in ("event_id","performance_id"):
                  if not merged.get(key) and incoming.get(key): merged[key]=incoming[key]
              sources=[]
              for record in (current,incoming):
                  for token in str(record.get("source") or "").split("+"):
                      if token and token not in sources: sources.append(token)
              if sources: merged["source"]="+".join(sources)
              return merged
          '''
          # A leading showtime remains a showtime even when a parenthetical opening time follows.
          s=exact(s,'    if not starts and not doors:\n        leading = re.match(r"^\\s*" + clock, text)','    if not starts:\n        leading = re.match(r"^\\s*" + clock + r"(?!\\s*開場)", text)')
          # A URL shared by different untimed performances does not establish identity.
          s=exact(s,'        return bool(a.get("official_url")) and a.get("official_url") == b.get("official_url")','        return bool(id_a and id_b and id_a == id_b)')
          p.write_text(s,encoding='utf-8')

          p=Path('update_events.py'); s=p.read_text(encoding='utf-8')
          s=exact(s,'import requests\n','import requests\nfrom event_integrity import same_performance, combine_performance, normalize_title\n')
          s=exact(s,'def valid_date(s):\n','''def load_required_events(path):
              """Never replace a missing/corrupt/empty saved event dataset."""
              try: data=json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  raise RuntimeError(f"保存済みイベントを読み込めません。更新を停止: {path}") from exc
              if not isinstance(data,list) or not data:
                  raise RuntimeError(f"保存済みイベントが空または配列ではありません。更新を停止: {path}")
              for item in data:
                  if (not isinstance(item,dict) or not isinstance(item.get("date"),str)
                      or not valid_date(item["date"]) or not isinstance(item.get("title"),str)
                      or len(item["title"].strip())<2 or not isinstance(item.get("hall"),str)
                      or not item["hall"].strip()):
                      raise RuntimeError(f"保存済みイベントに不正データ。更新を停止: {path}")
              return data

          def valid_date(s):
          ''')
          s=exact(s,'    if not valid_date(out["date"]) or len(out["title"])<2: return None\n','''    for name in ("event_id","performance_id","source_type","source_url","source_verified","verified_fields","event_specific","field_sources","review_conflicts","opening_time_sources"):
                  if name in e: out[name]=e[name]
              for name in ("date","title","hall","time","price","official_url"):
                  for suffix in ("_source_type","_source_url","_source_verified","_event_specific"):
                      key_name=name+suffix
                      if key_name in e: out[key_name]=e[key_name]
              if not valid_date(out["date"]) or len(out["title"])<2: return None
          ''')
          s=section(s,'def key(e): return ', 'def ym(e):', '''def key(e): return (e.get("date",""),normalize_title(e.get("title","")))
          def dedupe(events):
              """Merge only independently confirmed matching performances."""
              result=[]; groups={}
              for raw in events:
                  item=sanitize_event(raw)
                  if not item: continue
                  k=key(item)
                  matches=[i for i in groups.get(k,[]) if same_performance(result[i],item)]
                  if len(matches)==1:
                      i=matches[0]; result[i]=combine_performance(result[i],item)
                  else:
                      groups.setdefault(k,[]).append(len(result)); result.append(item)
              return sorted(result,key=lambda e:(e["date"],str(e.get("time") or ""),e["title"]))
          ''')
          s=exact(s,'old=dedupe(load_json(EVENTS_FILE,[])); old_meta=','old=dedupe(load_required_events(EVENTS_FILE)); old_meta=')
          # The city event listing proves only fields actually extracted from the corresponding row.
          s=exact(s,'"source":"event_guide","official_url":event_guide})','"source":"event_guide","official_url":event_guide,"source_type":"city_schedule","source_url":event_guide,"source_verified":True,"verified_fields":["date","title"]+(["hall"] if hall!="その他" else [])+(["time"] if tm else [])})')
          # An event-specific municipality page is an official event source, unlike its index URL.
          s=exact(s,'"source":source,"official_url":url} for d in dates]','"source":source,"official_url":url,"source_type":"event_official" if source=="city_event_calendar" else "other","source_url":url,"source_verified":source=="city_event_calendar","event_specific":source=="city_event_calendar","verified_fields":["date","title"]+(["hall"] if venue in text else [])+(["time"] if time else [])+(["price"] if price else [])} for d in dates]')
          p.write_text(s,encoding='utf-8')

          p=Path('manual-events.js'); s=p.read_text(encoding='utf-8')
          s=section(s,'  const verifiedCity = event => {','  const venues = event =>', '''  const verifiedCity = event => {
              const url=sourceUrl(event);
              return event.source_type==='city_official' && event.source_verified===true &&
                Boolean(url) && new URL(url).hostname==='www.city.inazawa.aichi.jp';
            };
            const fieldEvidence = (e,field) => {
              const stored=e.field_sources && e.field_sources[field];
              if (stored && typeof stored==='object') return stored;
              const allowed=e.verified_fields;
              return {source_type:e[`${field}_source_type`]||e.source_type||e.source||'other',
                source_url:e[`${field}_source_url`]||e.source_url||e.official_url||'',
                verified:(e[`${field}_source_verified`]??e.source_verified)===true &&
                  (!Array.isArray(allowed)||allowed.includes(field)),
                event_specific:(e[`${field}_event_specific`]??e.event_specific)===true};
            };
            const sourceRank = (e,field) => {
              const info=fieldEvidence(e,field);
              if(info.verified!==true)return 0;
              let url;
              try{url=new URL(info.source_url);if(url.protocol!=='https:')return 0;}catch(_){return 0;}
              const kind=info.source_type;
              if(['event_official','organizer','promoter'].includes(kind)&&info.event_specific===true)return 3;
              if(url.hostname==='www.city.inazawa.aichi.jp'&&
                 ['city_schedule','city_official','event_guide','city_event_calendar','schedule_ocr'].includes(kind))return 2;
              if(kind==='x'&&['x.com','www.x.com','twitter.com','www.twitter.com'].includes(url.hostname))return 1;
              return 0;
            };
          ''')
          s=section(s,'  const sameIdentity = ', '  const validated = ', '''  const timeParts = value => {
              const text=String(value||'').normalize('NFKC');
              const collect=pattern=>[...text.matchAll(pattern)].map(m=>[Number(m[1]),Number(m[2])])
                .filter(([h,m])=>h<24&&m<60)
                .map(([h,m])=>`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
              let starts=collect(/(?:開演|開始)\\s*(\\d{1,2}):(\\d{2})/g);
              const doors=collect(/開場\\s*(\\d{1,2}):(\\d{2})/g);
              if(!starts.length){const first=text.match(/^\\s*(\\d{1,2}):(\\d{2})(?!\\s*開場)/);
                if(first){starts=[`${first[1].padStart(2,'0')}:${first[2]}`];
                  if(text.includes('/'))starts=collect(/(\\d{1,2}):(\\d{2})/g);}}
              return {starts:[...new Set(starts)],doors:[...new Set(doors)]};
            };
            const sameShowtime=(a,b)=>{
              if(a.performance_id&&b.performance_id)return a.performance_id===b.performance_id;
              const x=timeParts(a.time),y=timeParts(b.time);
              if(x.starts.length===1&&y.starts.length===1)return x.starts[0]===y.starts[0];
              if(x.starts.length>1||y.starts.length>1)return Boolean(a.time&&a.time===b.time);
              if(x.doors.length===1&&y.doors.length===1&&!x.starts.length&&!y.starts.length)
                return x.doors[0]===y.doors[0];
              return false;
            };
            const sameIdentity=(existing,match,requireTime)=> existing.date===match.date &&
              normalizeTitle(existing.title)===normalizeTitle(match.title) &&
              (!match.hall||venues(existing).includes(match.hall)) &&
              (!requireTime||sameShowtime(existing,match));
          ''')
          s=exact(s,"!['x', 'city_official', 'other'].includes(raw.source_type)","!['x', 'city_official', 'city_schedule', 'event_official', 'organizer', 'promoter', 'other'].includes(raw.source_type)")
          s=section(s,'    if (raw.match && (', "    if (raw.source_type === 'city_official'", '''    if(raw.match){
                  let good=false;
                  try{good=new URL(raw.match.evidence_url).protocol==='https:';}catch(_){}
                  if(!validDate(raw.match.date)||typeof raw.match.title!=='string'||
                     !raw.match.title.trim()||raw.match.confirmed!==true||!good||
                     (raw.match.correct_fields!==undefined&&(!Array.isArray(raw.match.correct_fields)||
                       raw.match.correct_fields.some(field=>!['date','title','hall','time','price','official_url'].includes(field)))))
                    throw new Error('重複照合には確認済みの公演と根拠URLが必要です');
                }
                if(raw.distinct_performance){
                  let good=false;
                  try{good=new URL(raw.distinct_performance_evidence_url).protocol==='https:';}catch(_){}
                  if(raw.match||typeof raw.performance_id!=='string'||!raw.performance_id.trim()||!good)
                    throw new Error('別公演には固有IDと根拠URLが必要です');
                }
          ''')
          s=section(s,'  function merge(auto, manual) {','  window.mergeForumEvents = merge;', '''  function merge(auto,manual){
              if(!Array.isArray(auto)||!Array.isArray(manual))throw new Error('イベント配列が不正です');
              const result=auto.map(e=>({...e})); const ids=new Set();
              for(const raw of manual){
                const incoming=validated(raw,ids);
                const find=(target,withTime)=>result.map((e,i)=>sameIdentity(e,target,withTime)?i:-1).filter(i=>i>=0);
                let matches=incoming.distinct_performance?[]:find(incoming,true);
                if(incoming.match){matches=find(incoming.match,Boolean(incoming.match.time));
                  if(matches.length!==1)throw new Error(`照合対象を一意に特定できません: ${incoming.title}`);}
                if(!matches.length&&find(incoming,false).length&&!incoming.distinct_performance)
                  throw new Error(`同日同名の公演に食い違いがあります。確認してください: ${incoming.title}`);
                if(matches.length>1)throw new Error(`重複候補が複数あります: ${incoming.title}`);
                if(!matches.length){result.push(incoming);continue;}
                const current=result[matches[0]], combined={...current,field_sources:{...(current.field_sources||{})}};
                const corrected=Array.isArray(incoming.match?.correct_fields)?incoming.match.correct_fields:[];
                for(const field of ['date','title','hall','time','price','official_url']){
                  const value=incoming[field];if(value===undefined||value===null||value==='')continue;
                  const a=sourceRank(current,field),b=sourceRank(incoming,field);
                  if(!current[field]||b>a||(incoming.match&&corrected.includes(field)&&b>=a)){
                    combined[field]=value;combined.field_sources[field]=fieldEvidence(incoming,field);
                    if(field==='hall')combined.venues=venues(incoming);
                  }else if(current[field]===value&&b>a)combined.field_sources[field]=fieldEvidence(incoming,field);
                  else if(current[field]!==value&&a===b&&a>0&&!corrected.includes(field))
                    throw new Error(`同順位の出典が食い違います。確認してください: ${field}`);
                }
                const t1=timeParts(current.time),t2=timeParts(incoming.time);
                if(t1.starts.length===1&&t2.starts.length===1&&t1.starts[0]===t2.starts[0]&&
                   (t1.doors.length||t2.doors.length)){
                  const door=t1.doors[0]||t2.doors[0];
                  if(t1.doors.length&&t2.doors.length&&t1.doors[0]!==t2.doors[0])
                    throw new Error('開場時間が食い違います。確認してください');
                  combined.time=`開場${door}／開演${t1.starts[0]}`;
                  combined.opening_time_sources=[current,incoming].filter(e=>timeParts(e.time).doors.length).map(e=>fieldEvidence(e,'time'));
                }
                result[matches[0]]=combined;
              }
              return result;
            }
          ''')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_manual_merge.cjs'); s=p.read_text(encoding='utf-8')
          s=exact(s,"assert.equal(result[0].time, '開演18:00');","assert.equal(result[0].time, '開場17:30／開演18:00');",1)
          s+='''\n// Verified field priority: event official > city schedule > X, regardless of insertion order.\nconst proof=(id,time,source_type,source_url,rank)=>manual(id,time,{source_type,source_url,source_verified:true,event_specific:rank===3,verified_fields:['time']});\nconst x=proof('x','開演18:00','x','https://x.com/example/status/123',1);\nconst city=proof('city','開演18:00','city_schedule','https://www.city.inazawa.aichi.jp/ica/0000002507.html',2);\nconst official=proof('official','開演18:00','event_official','https://example.org/event/123',3);\nconst withRank=(value,e)=>({...e,price:'',time_source_verified:true,time:value});\nresult=merge([withRank('開演18:00',x)], [withRank('開演18:00',city)]);\nassert.equal(result[0].field_sources.time.source_type,'city_schedule');\nresult=merge([result[0]], [withRank('開演18:00',official)]);\nassert.equal(result[0].field_sources.time.source_type,'event_official');\n'''
          p.write_text(s,encoding='utf-8')
          p=Path('tests/test_event_integrity.py');s=p.read_text(encoding='utf-8')
          s=exact(s,'    city_verified, combine_performance, same_performance, time_parts,','    city_verified, combine_performance, same_performance, time_parts, source_rank,')
          s=exact(s,'    def test_unverified_city_link_is_not_verification(self):','''    def test_verified_field_ranking_and_protection(self):
                  base=event('開演18:00',source_type='x',source_url='https://x.com/a/status/1',source_verified=True,verified_fields=['time'])
                  city=event('開演18:00',source_type='city_schedule',source_url='https://www.city.inazawa.aichi.jp/ica/0000002507.html',source_verified=True,verified_fields=['time'])
                  official=event('開演18:00',source_type='event_official',source_url='https://example.org/events/1',source_verified=True,event_specific=True,verified_fields=['time'])
                  self.assertEqual([source_rank(x,'time') for x in (base,city,official)],[1,2,3])
                  merged=combine_performance(base,city)
                  self.assertEqual(merged['field_sources']['time']['source_type'],'city_schedule')
                  merged=combine_performance(merged,official)
                  self.assertEqual(merged['field_sources']['time']['source_type'],'event_official')
                  self.assertEqual(source_rank(event('開演18:00',source_type='event_official',source_url='https://example.org',source_verified=True),'time'),0)

              def test_unverified_city_link_is_not_verification(self):''')
          p.write_text(s,encoding='utf-8')
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=exact(s,'Ver.9.3.3','Ver.9.3.4',2)
          s=exact(s,'manual-events.js?v=932','manual-events.js?v=934')
          s=exact(s,'sw.js?v=933','sw.js?v=934')
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js');p.write_text(exact(p.read_text(encoding='utf-8'),'forum-calendar-v9-3-3','forum-calendar-v9-3-4'),encoding='utf-8')
          p=Path('CHANGELOG.md');s=p.read_text(encoding='utf-8')
          entry=('## Ver.9.3.4 — イベント情報の安全な統合（2026-09-20）\n'
                 '- 既存イベントJSONが欠落・破損・空の場合は自動更新を停止し、元データを保護。\n'
                 '- 同じ公演と確認できる場合のみ統合し、異なる開演時間は分離。開場と開演を区別。\n'
