          examples=[{'date':'2026-10-31','title':'演奏会','hall':'中ホール','time':'開演10:00'}, {'date':'2026-10-31','title':'演奏会','hall':'中ホール','time':'開演18:00'}]
          assert len(dedupe(examples))==2
          assert Path('events.json').read_bytes()==original
          assert Path('manual_events.json').read_bytes()==manual
          print('Saved-data guard, two-performance separation, and data isolation passed')
          PY
          git diff --check
          python - <<'PY'
          import subprocess
          allowed={'event_integrity.py','update_events.py','manual-events.js','index.html','sw.js','CHANGELOG.md','tests/test_manual_merge.cjs','tests/test_event_integrity.py'}
          changes=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changes==allowed, f'Unexpected changes: {changes}'
          PY
      - name: Commit only tested application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name forum-calendar-bot
          git config user.email actions@users.noreply.github.com
          git add -- event_integrity.py update_events.py manual-events.js index.html sw.js CHANGELOG.md tests/test_manual_merge.cjs tests/test_event_integrity.py
          git diff --cached --check
          git commit -m 'Protect event data and apply verified per-field source precedence'
          git push origin HEAD:main
      - name: Request Pages build for bot push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl --silent --show-error --output /tmp/pages-result.json --write-out '%{http_code}' --request POST --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${REPOSITORY}/pages/builds")
          cat /tmp/pages-result.json
          test "$status" = '201'
