name: Diagnose JR Walking Web

on:
  push:
    branches:
      - fix-jr-walking-web-20260903
    paths:
      - diagnose_jr_web.py
      - jr_walking_web.py
      - update_events_no_ocr.py
      - .github/workflows/diagnose-jr-web.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe JR official web data
        run: python diagnose_jr_web.py
      - name: Validate safe updater without committing
        run: |
          python update_events_no_ocr.py
          python - <<'PY'
          import json
          from pathlib import Path
          events=json.loads(Path('events.json').read_text(encoding='utf-8'))
          meta=json.loads(Path('update-meta.json').read_text(encoding='utf-8'))
          print('VALIDATION event_count=', len(events))
          print('VALIDATION status=', meta.get('status'))
          print('VALIDATION notes=', meta.get('notes'))
          if len(events) < 70:
              raise SystemExit('Unexpected event loss')
          if meta.get('status') != 'ok':
              raise SystemExit('Updater status is not ok')
          PY
          git diff -- events.json update-meta.json
