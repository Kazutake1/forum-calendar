name: Calendar Integrity Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: Verify Node.js patched runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          test "$(node --version)" = "v22.23.4"
      - run: pip install -r requirements.txt
      - name: Python data, identity, and archival regression tests
        run: python -m unittest discover -s tests -v
      - name: Temporary read-only official guide diagnostic (PR 54 only)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/event-guide-labeled-sections'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          import update_events as u
          from event_integrity import same_performance

          url = "https://www.city.inazawa.aichi.jp/ica/0000002507.html"
          response = u.get(url)
          html = response.text
          print("LIVE_SOURCE",json.dumps({
              "url":response.url, "status":response.status_code,
              "bytes":len(response.content), "last_modified":response.headers.get("Last-Modified"),
          },ensure_ascii=False),flush=True)
          soup = BeautifulSoup(html,"html.parser")
          headings = [u.clean(h.get_text(" ",strip=True),200) for h in soup.find_all("h2")]
          print("LIVE_H2",json.dumps(headings,ensure_ascii=False),flush=True)
          for h in soup.find_all("h2"):
              title = u.clean(h.get_text(" ",strip=True),140)
              if not title or u.is_non_event_guide_notice(title):
                  continue
              sect = u._guide_section_text(h)
              if "令和" in sect["date"] or "20" in sect["date"]:
                  print("LIVE_H2_SECTIONS",json.dumps({
                      "title":title, "date":sect["date"][:180],
                      "time":sect["time"][:180], "hall":sect["hall"][:180]
                  },ensure_ascii=False),flush=True)

          from unittest.mock import patch
          with patch("update_events.get",return_value=response):
              candidates=u.parse_event_guide(url)
          auto=json.loads(Path("events.json").read_text(encoding="utf-8"))
          manual=json.loads(Path("manual_events.json").read_text(encoding="utf-8"))
          verified=json.loads(Path("verified_schedule.json").read_text(encoding="utf-8"))["events"]
          for item in candidates:
              matches={}
              overlaps={}
              for key,group in (("auto",auto),("manual",manual),("verified",verified)):
                  overlaps[key]=[{"title":e["title"],"time":e.get("time","")}
                      for e in group if e["date"]==item["date"] and
                      item["hall"] in (e.get("venues") or [e.get("hall")])]
                  matches[key]=[e["title"] for e in group if same_performance(e,item)]
              print("LIVE_CANDIDATE",json.dumps({
                  "date":item["date"],"title":item["title"],"hall":item["hall"],
                  "time":item["time"],"matches":matches,"same_slot":overlaps
              },ensure_ascii=False),flush=True)
          proposed, applied, pending = u.reconcile_official_guide(
              auto, candidates, manual, verified, "2026-11-08T03:24:27+00:00")
          print("LIVE_RECONCILE",json.dumps({
              "existing_auto":len(auto), "proposed_auto":len(proposed),
              "accepted":len(applied), "pending":pending,
              "changes":[{"date":x.get("date"),"title":x.get("title"),
                          "time":x.get("time"),"history":x.get("official_change_history",[])}
                         for x in proposed if x.get("official_change_history")]
          },ensure_ascii=False),flush=True)
          assert len(proposed) == len(auto), "Live check must not add/delete events"
          assert len(applied) == 6 and not pending, "Live correction needs review"
          assert len(manual) == 5 and len(verified) == 58
          print("LIVE_SUMMARY",json.dumps({
              "headings":len(headings),"candidates":len(candidates),
              "auto_count":len(auto),"manual_count":len(manual),
              "verified_count":len(verified)
          },ensure_ascii=False),flush=True)
          PY
      - name: Browser manual merge regression tests
        run: node tests/test_manual_merge.cjs
      - name: Verified schedule regression tests
        run: node tests/test_verified_schedule.cjs
      - name: Interrupted month-navigation regression tests
        run: node tests/test_month_animation.cjs
      - name: Calendar selection regression tests
        run: node tests/test_calendar_selectors.cjs
      - name: Event overlay transaction regression tests
        run: node tests/test_event_overlay_transaction.cjs
      - name: Verified schedule offline regression tests
        run: node tests/test_verified_offline.cjs
      - name: Automatic event offline cache regression tests
        run: node tests/test_auto_offline.cjs
      - name: Verify Python and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile event_integrity.py update_events.py update_events_no_ocr.py jr_walking_web.py manage_manual_events.py
          python -m json.tool event-policy.json > /dev/null
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          match=re.search(r'<script>\s*(.*?)\s*</script>',html,re.S)
          assert match, 'Inline script not found'
          Path('/tmp/forum-calendar-inline.js').write_text(match.group(1),encoding='utf-8')
          PY
          node --check /tmp/forum-calendar-inline.js
          node --check manual-events.js
          node --check verified-schedule.js
          node --check sw.js
      - name: Validate published event JSON without altering files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from update_events import load_required_events
          auto=load_required_events(Path('events.json'))
          manual=json.loads(Path('manual_events.json').read_text(encoding='utf-8'))
          assert isinstance(manual,list)
          ids=[event['id'] for event in manual]
          assert len(ids)==len(set(ids)), 'Duplicate manual event IDs'
          print(f'Validated {len(auto)} automatic and {len(manual)} manual events')
          PY
      - name: Add synthetic archive for Pages preview (CI only)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e archive/manual_events_9999.json
          mkdir -p archive
          printf '%s\n' '[]' > archive/manual_events_9999.json
      - name: Preview GitHub Pages Jekyll build (test only; no deploy)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1; Docker image ghcr.io/actions/jekyll-build-pages:v1.0.13
        with:
          source: .
          destination: ./_site
      - name: Verify actual generated Pages payload (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          source = Path(".")
          output = Path("_site")
          required = {
              "index.html", "sw.js", "manifest.json",
              "icon-180.png", "icon-192.png", "icon-512.png",
              "manual-events.js", "verified-schedule.js",
              "events.json", "manual_events.json",
              "verified_schedule.json", "event-policy.json",
              "update-meta.json",
          }
          generated_theme_css = {"assets/css/style.css"}
          expected = required | generated_theme_css
          if not output.is_dir():
              raise AssertionError("Jekyll build output is absent")
          actual = {p.relative_to(output).as_posix()
                    for p in output.rglob("*") if p.is_file()}
          unexpected = sorted(actual - expected)
          missing = sorted(expected - actual)
          if missing or unexpected:
              raise AssertionError(
                  f"Pages manifest mismatch. Missing: {missing}; unexpected: {unexpected}"
              )
          for name in sorted(required):
              original = (source / name).read_bytes()
              published = (output / name).read_bytes()
              if hashlib.sha256(original).digest() != hashlib.sha256(published).digest():
                  raise AssertionError(f"Published PWA asset changed: {name}")
          print(
              "PASS: Jekyll 3 build output contains only 13 byte-identical "
              "PWA assets plus expected generated theme CSS (14 files total)"
          )
          PY
