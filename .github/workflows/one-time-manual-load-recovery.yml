name: Apply manual event loading recovery once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-manual-load-recovery.yml']
permissions:
  contents: write
concurrency:
  group: one-time-manual-load-recovery
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Patch loader, version, history and regression tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main changed; abort'; exit 1; }
          python - <<'PY'
          from pathlib import Path
          def replace_one(s,old,new):
              assert s.count(old)==1, (old[:70],s.count(old))
              return s.replace(old,new)
          p=Path('manual-events.js'); s=p.read_text(encoding='utf-8')
          start='  window.loadManualForumEvents = async () => {'
          assert s.count(start)==1 and s.endswith('})();\n')
          s=s[:s.index(start)]+'''  window.loadManualForumEvents = async () => {
            const status = document.querySelector('#autoUpdated');
            let stage = '取得';
            try {
              let response;
              let usingCache = false;
              try {
                response = await fetch('./manual_events.json?ts=' + Date.now(), { cache: 'no-store' });
              } catch (networkError) {
                let cached = null;
                try {
                  if (window.caches && typeof window.caches.match === 'function') {
                    cached = await window.caches.match('./manual_events.json');
                  }
                } catch (_) { /* CacheStorage may be unavailable in private browsing. */ }
                if (!cached) throw networkError;
                response = cached;
                usingCache = true;
              }
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              if (response.headers && typeof response.headers.get === 'function' &&
                  response.headers.get('X-Forum-Manual-Cache') === 'stale') usingCache = true;
              stage = 'JSON解析';
              const manual = await response.json();
              stage = '統合';
              const merged = merge(EVENTS, manual);
              const before = EVENTS;
              EVENTS = merged;
              stage = '表示';
              try { refresh(); } catch (error) { EVENTS = before; throw error; }
              if (usingCache && status) {
                status.classList.add('stale');
                status.textContent += ' ・ 手動登録：通信できないため保存済みデータを表示';
              }
            } catch (error) {
              console.error(`手動イベントの${stage}に失敗しました`, error);
              if (status) {
                const detail = String(error && error.message || '原因不明').slice(0, 100);
                status.classList.add('stale');
                status.textContent += ` ・ 手動登録データの${stage}失敗（${detail}）`;
              }
            }
          };
          })();
          '''
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          s=replace_one(s,"          await (await caches.open(CACHE)).put(MANUAL_DATA,response.clone());", "          try { await (await caches.open(CACHE)).put(MANUAL_DATA,response.clone()); }\n          catch (cacheError) { console.warn('手動データのキャッシュ保存を省略',cacheError); }")
          s=replace_one(s,"caches.match(req).then(r=>r||caches.match('./index.html'))","caches.match(req,{ignoreSearch:true}).then(r=>r||caches.match('./index.html'))")
          p.write_text(s,encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          assert s.count('Ver.9.3.4')==2
          s=s.replace('Ver.9.3.4','Ver.9.3.5')
          s=replace_one(s,'manual-events.js?v=934','manual-events.js?v=935')
          s=replace_one(s,'sw.js?v=934','sw.js?v=935')
          p.write_text(s,encoding='utf-8')
          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          entry=('## Ver.9.3.5 — 手動イベントの取得障害対策（2026-09-20）\n'
                 '- 公開中の手動イベント4件と自動イベント80件による統合テストを恒久追加。\n'
                 '- 手動データをService Workerへ事前保存し、通信障害時は保存済みデータに切り替えて警告を表示。\n'
                 '- 取得・JSON解析・統合・表示の失敗を区別し、原因を画面と開発者ログに表示。\n'
                 '- 正常な通信結果はキャッシュ保存失敗に妨げられず表示する。既存イベントデータや自動更新処理は変更なし。\n\n')
          s=replace_one(s,'# 更新履歴\n\n','# 更新履歴\n\n'+entry)
          p.write_text(s,encoding='utf-8')
          p=Path('tests/test_manual_merge.cjs'); s=p.read_text(encoding='utf-8')
          assert 'Manual recovery integration tests passed.' not in s
          s+='''\n// Exercise the actual loader using the published data in a browser-like context.
          async function testManualRecovery() {
            const response = { ok: true, headers: { get: () => null }, json: async () => publishedManual };
            const makePage = (fetcher, cached) => {
              const status = { textContent: '自動更新済み', classList: { add() {} } };
              let refreshed = 0;
              const page = { window: { caches: { match: async () => cached } }, URL, console,
                EVENTS: publishedAuto.slice(), refresh: () => { refreshed++; },
                linkInfo: () => ({ url: '#', label: 'test' }),
                document: { querySelector: () => status }, fetch: fetcher };
              vm.runInContext(fs.readFileSync('manual-events.js', 'utf8'), vm.createContext(page));
              return { page, status, getRefreshed: () => refreshed };
            };
            const good = makePage(async () => response, null);
            await good.page.window.loadManualForumEvents();
            assert.equal(good.page.EVENTS.length, publishedMerged.length);
            assert.equal(good.getRefreshed(), 1);
            assert.ok(!good.status.textContent.includes('失敗'));

            const offline = makePage(async () => { throw Error('offline'); }, response);
            await offline.page.window.loadManualForumEvents();
            assert.equal(offline.page.EVENTS.length, publishedMerged.length);
            assert.equal(offline.getRefreshed(), 1);
            assert.ok(offline.status.textContent.includes('保存済みデータを表示'));

            const failure = makePage(async () => { throw Error('network unavailable'); }, null);
            await failure.page.window.loadManualForumEvents();
            assert.equal(failure.page.EVENTS.length, publishedAuto.length);
            assert.equal(failure.getRefreshed(), 0);
            assert.ok(failure.status.textContent.includes('取得失敗'));
            assert.ok(failure.status.textContent.includes('network unavailable'));
            console.log('Manual recovery integration tests passed.');
          }
          testManualRecovery().catch(e => { console.error(e); process.exitCode = 1; });
          '''
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run complete regression suite and confirm data unchanged
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          node tests/test_manual_merge.cjs
          node --check manual-events.js
          node --check sw.js
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from update_events import load_required_events
          assert len(load_required_events(Path('events.json')))>0
          manual=json.loads(Path('manual_events.json').read_text(encoding='utf-8'))
          assert len(manual)==4
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'manual-events.js','sw.js','index.html','CHANGELOG.md','tests/test_manual_merge.cjs'}
          assert changed==expected,(changed,expected)
          assert 'Ver.9.3.5' in Path('index.html').read_text(encoding='utf-8')
          PY
          git diff --check
      - name: Publish tested code only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main changed; abort'; exit 1; }
          git config user.name 'forum-calendar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add manual-events.js sw.js index.html CHANGELOG.md tests/test_manual_merge.cjs
          git commit -m 'Recover manual event loading and expose precise failures (9.3.5)'
          git push origin HEAD:main
