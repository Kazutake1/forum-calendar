name: Update Forum Events

on:
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: forum-calendar-main-write
  cancel-in-progress: false

jobs:
  update-events:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Update event data (OCR disabled)
        run: python update_events_no_ocr.py

      - name: Validate generated event files (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from update_events import load_required_events

          events = load_required_events(Path("events.json"))
          meta = json.loads(Path("update-meta.json").read_text(encoding="utf-8"))
          if (not isinstance(meta, dict)
                  or type(meta.get("event_count")) is not int
                  or meta["event_count"] != len(events)):
              raise RuntimeError("Generated events and update metadata disagree")
          if meta.get("status") not in ("ok", "partial"):
              raise RuntimeError("All event sources failed; preserving last published data")
          print(f"Validated {len(events)} generated events and update metadata")
          PY

      - name: Reject suspicious event loss before proposing PR
        run: python daily_event_volume_guard.py

      - name: Verify updated data before proposing PR
        run: python -m unittest discover -s tests -v

      - name: Check exact daily output files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            case "${entry:3}" in
              events.json|update-meta.json) ;;
              *) echo "Unexpected changed file; refusing to publish." >&2; exit 1 ;;
            esac
          done < <(git status --porcelain --untracked-files=all)
          git add -- events.json update-meta.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No event-data changes; no PR necessary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Issue short-lived repository-scoped GitHub App token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FORUM_CALENDAR_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORUM_CALENDAR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Reconcile stale daily PRs from previous runs
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
        run: python daily_auto_merge.py --cleanup-stale

      - name: Open daily event PR for verified automatic publication
        id: proposal
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY" != "Kazutake1/forum-calendar" ]]; then
            echo "Unexpected repository; refusing to publish." >&2
            exit 1
          fi
          for value in "$RUN_ID" "$RUN_ATTEMPT"; do
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "Invalid workflow execution identifier." >&2
              exit 1
            fi
          done
          # Never generate competing PRs; a stalled PR requires investigation.
          pending=$(gh api --paginate "repos/${REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("automation/daily-events/")) | .number')
          if [[ -n "$pending" ]]; then
            echo "An earlier daily PR is still open; refusing a competing update." >&2
            exit 1
          fi
          current=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current" != "$BASE_SHA" ]]; then
            echo "main changed while events were generated; refusing a stale PR." >&2
            exit 1
          fi
          branch="automation/daily-events/${RUN_ID}-${RUN_ATTEMPT}"
          gh api "repos/${REPOSITORY}/git/refs" -X POST \
            -f ref="refs/heads/${branch}" -f sha="$BASE_SHA" >/dev/null
          for path in events.json update-meta.json; do
            if git diff --cached --quiet -- "$path"; then
              continue
            fi
            # Send JSON on stdin so growing event data never appears as a CLI argument.
            python -c 'import base64,json,sys; from pathlib import Path; p,b=sys.argv[1:]; print(json.dumps({"branch":b,"content":base64.b64encode(Path(p).read_bytes()).decode("ascii"),"message":"Propose updated "+p+" for review"}))' "$path" "$branch" \
              | gh api "repos/${REPOSITORY}/contents/${path}" -X PUT --input - >/dev/null
          done
          pr_number=$(gh api "repos/${REPOSITORY}/pulls" -X POST \
            -f head="$branch" -f base=main \
            -f title="data: automated daily forum event update (CI required)" \
            -f body="Automated event update. Only events.json and update-meta.json are allowed; exact-HEAD CI and source must be verified before automatic merge. Unsafe updates halt." \
            -F draft=false --jq '.number')
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Missing PR number; refusing to merge." >&2
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          printf 'Submitted daily update PR #%s; checking CI before publication.\n' "$pr_number" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact PR and CI before automatic publication
        if: steps.changes.outputs.changed == 'true' && steps.proposal.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_CI_READ_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ steps.proposal.outputs.number }}
          PR_BRANCH: ${{ steps.proposal.outputs.branch }}
        run: python daily_auto_merge.py
