name: Update Forum Events

on:
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: forum-calendar-main-write
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Required for git push in this trusted main-only writer

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Update event data (OCR disabled)
        run: python update_events_no_ocr.py

      - name: Validate generated event files (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from update_events import load_required_events

          events = load_required_events(Path("events.json"))
          meta = json.loads(Path("update-meta.json").read_text(encoding="utf-8"))
          if (not isinstance(meta, dict)
                  or type(meta.get("event_count")) is not int
                  or meta["event_count"] != len(events)):
              raise RuntimeError("Generated events and update metadata disagree")
          print(f"Validated {len(events)} generated events and update metadata")
          PY

      - name: Verify updated data before committing to main
        run: python -m unittest discover -s tests -v

      - name: Commit updated data
        id: persist
        run: |
          git config user.name "forum-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json update-meta.json
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update forum events"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explicitly request Pages rebuild after bot commit
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          # A GITHUB_TOKEN push alone does NOT start a GitHub Pages build.
          response=$(curl --silent --show-error --location --output /tmp/pages-build-response.json \
            --write-out '%{http_code}' --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/pages/builds")
          cat /tmp/pages-build-response.json
          if [[ "$response" != "201" ]]; then
            echo "Pages build request failed (HTTP $response). GitHub data may be newer than the published app." >&2
            exit 1
          fi
          echo "Pages build requested for updated automatic event data." >> "$GITHUB_STEP_SUMMARY"
