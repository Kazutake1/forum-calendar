name: Update Forum Events

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-jpn

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Update event data
        run: python update_events.py

      - name: Commit updated data
        run: |
          git config user.name "forum-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json update-meta.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update forum events"
            git push
          fi
