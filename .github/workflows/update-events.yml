name: Update Forum Events

on:
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forum-calendar-main-write
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true # Required for git push in this trusted main-only writer

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Update event data (OCR disabled)
        run: python update_events_no_ocr.py

      - name: Commit updated data
        run: |
          git config user.name "forum-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json update-meta.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update forum events"
            git push
          fi
