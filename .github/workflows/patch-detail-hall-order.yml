name: Patch detail hall order

on:
  push:
    branches:
      - fix-detail-hall-order-20260918
    paths:
      - .github/workflows/patch-detail-hall-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-detail-hall-order-20260918
      - name: Change selected-date detail ordering only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          original = path.read_text(encoding='utf-8')
          old = 'function detailsHTML(es){return es.length?es.map(e=>'
          new = "function detailHallRank(e){const vs=venuesOf(e);return vs.includes('大ホール')?0:vs.includes('中ホール')?1:vs.includes('小ホール')?2:3}\nfunction detailsHTML(es){return es.length?es.slice().sort((a,b)=>detailHallRank(a)-detailHallRank(b)).map(e=>"
          assert original.count(old) == 1, 'Expected exactly one detail renderer'
          updated = original.replace(old, new, 1)
          assert updated.replace(new, old, 1) == original, 'Unexpected changes'
          path.write_text(updated, encoding='utf-8')
          print('Changed only selected-date detail ordering.')
          PY
      - name: Verify syntax, venue order and unchanged other views
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/forum-calendar-detail-check.js').write_text(html.split('<script>', 1)[1].rsplit('</script>', 1)[0], encoding='utf-8')
          assert 'function showDate(k)' in html and 'function refresh()' in html
          assert html.count('detailsHTML(es)') >= 2
          PY
          node --check /tmp/forum-calendar-detail-check.js
          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const vm = require('vm');
          const code = fs.readFileSync('index.html', 'utf8');
          const rankSource = code.match(/function detailHallRank\(e\)\{[^\n]+\}/);
          assert(rankSource, 'Detail rank function missing');
          const venuesOf = e => Array.isArray(e.venues) && e.venues.length ? e.venues : [e.hall].filter(Boolean);
          const rank = vm.runInNewContext(`${rankSource[0]};detailHallRank`, {venuesOf});
          const events = [
            {name:'small1',hall:'小ホール'},
            {name:'other',hall:'文化の丘公園'},
            {name:'mid1',hall:'中ホール'},
            {name:'large1',hall:'大ホール'},
            {name:'large2',hall:'大ホール'},
            {name:'small2',hall:'小ホール'}
          ];
          const actual = events.slice().sort((a,b)=>rank(a)-rank(b)).map(e=>e.name);
          assert.deepStrictEqual(actual,['large1','large2','mid1','small1','small2','other']);
          assert.deepStrictEqual(events.map(e=>e.name), ['small1','other','mid1','large1','large2','small2']);
          console.log('PASS: large → medium → small; stable order; original data unchanged');
          JS
          git diff --check
          test "$(git diff --name-only)" = 'index.html'
      - name: Commit isolated change to branch
        run: |
          git config user.name "forum-calendar-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show large hall first in selected-date event details"
          git push origin HEAD:fix-detail-hall-order-20260918
