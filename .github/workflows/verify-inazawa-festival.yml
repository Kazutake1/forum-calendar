name: Verify Inazawa festival dates and venue
on:
  push:
    branches:
      - fix-inazawa-festival-dates-20260918
    paths:
      - .github/workflows/verify-inazawa-festival.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-inazawa-festival-dates-20260918
      - name: Install parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Patch festival parser and correct stored data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path=Path('update_events.py')
          original=path.read_text(encoding='utf-8')
          old_venue='''VENUE_CORRECTIONS = {
              "食品衛生責任者養成講習会": "小ホール",
          }'''
          new_venue='''VENUE_CORRECTIONS = {
              "食品衛生責任者養成講習会": "小ホール",
              "稲沢まつり": "その他",
          }'''
          old_dates=r'''        base=re.search(r"(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日",frag)
                  if base:
                      y,m=int(base.group(1)),int(base.group(2))
                      for d in re.findall(r"(?:・|、|,|及び|と)\s*(\d{1,2})日",frag[base.end():]):
                          try: candidates.append(datetime(y,m,int(d)).date())
                          except ValueError: pass'''
          new_dates=r'''        base=re.search(r"(?:(20\d{2})年|令和\s*(\d+)年)\s*(\d{1,2})月\s*(\d{1,2})日",frag)
                  if base:
                      y=int(base.group(1)) if base.group(1) else 2018+int(base.group(2))
                      m=int(base.group(3))
                      # Handle 17日（土曜）、10月18日 and 17日、18日.
                      for extra in re.finditer(r"(?:\s*[（(][^（）()]{0,12}[）)])?\s*(?:・|、|,|及び|と)\s*(?:(\d{1,2})月\s*)?(\d{1,2})日",frag[base.end():]):
                          try: candidates.append(datetime(y,int(extra.group(1) or m),int(extra.group(2))).date())
                          except ValueError: pass'''
          old_park='''def park_event_from_page(url,source):
              r=get(url); soup=BeautifulSoup(r.text,"html.parser"); text=clean(soup.get_text(" ",strip=True),12000)
              if PARK_NAME not in text: return []
              h1=soup.find("h1"); title=clean(h1.get_text(" ",strip=True) if h1 else (soup.title.get_text(" ",strip=True) if soup.title else ""),240)
              if not title or title in {"イベントカレンダー","イベント"}: return []
              dates=expand_dates_from_text(text); today=datetime.now().date(); dates=[d for d in dates if today-timedelta(days=45)<=d<=today+timedelta(days=420)]; time=parse_time_from_text(text); price="無料" if "入場無料" in text or "入場料：なし" in text or "入場料:なし" in text else ""
              return [{"date":d.strftime("%Y-%m-%d"),"hall":PARK_NAME,"venues":[PARK_NAME],"time":time,"title":title,"price":price,"source":source,"official_url":url} for d in dates]'''
          new_park='''def park_event_from_page(url,source):
              r=get(url); soup=BeautifulSoup(r.text,"html.parser"); text=clean(soup.get_text(" ",strip=True),12000)
              h1=soup.find("h1"); title=clean(h1.get_text(" ",strip=True) if h1 else (soup.title.get_text(" ",strip=True) if soup.title else ""),240)
              if not title or title in {"イベントカレンダー","イベント"}: return []
              # The city reuses this official page for the multi-venue festival each year.
              festival=(title=="稲沢まつり" and urlparse(url).hostname=="www.city.inazawa.aichi.jp" and urlparse(url).path=="/0000000913.html")
              if not festival and PARK_NAME not in text: return []
              if festival:
                  # Read the overall dates, not the subsequent individual venue schedules.
                  date_section=re.search(r"開催日\s*(.*?)\s*開催時間",text)
                  time_section=re.search(r"開催時間\s*(.*?)\s*開催場所",text)
                  if not date_section: return []
                  dates=expand_dates_from_text("開催日 "+date_section.group(1))
                  time=parse_time_from_text(time_section.group(1)) if time_section else ""
                  venue="その他"
              else:
                  dates=expand_dates_from_text(text)
                  time=parse_time_from_text(text)
                  venue=PARK_NAME
              today=datetime.now().date(); dates=[d for d in dates if today-timedelta(days=45)<=d<=today+timedelta(days=420)]; price="無料" if "入場無料" in text or "入場料：なし" in text or "入場料:なし" in text else ""
              return [{"date":d.strftime("%Y-%m-%d"),"hall":venue,"venues":[venue],"time":time,"title":title,"price":price,"source":source,"official_url":url} for d in dates]'''
          for old,new in [(old_venue,new_venue),(old_dates,new_dates),(old_park,new_park)]:
              assert original.count(old)==1, f'Expected exactly one patch site: {old[:65]!r} found {original.count(old)}'
              original=original.replace(old,new,1)
          path.write_text(original,encoding='utf-8')

          data_path=Path('events.json')
          events=json.loads(data_path.read_text(encoding='utf-8'))
          url='https://www.city.inazawa.aichi.jp/0000000913.html'
          matches=[i for i,e in enumerate(events) if e.get('title')=='稲沢まつり' and e.get('official_url')==url]
          assert len(matches)==1, f'Expected one old festival row, found {len(matches)}'
          i=matches[0]
          old=events[i]
          assert old['date']=='2026-10-17' and old['hall']=='文化の丘公園'
          assert not any(e.get('title')=='稲沢まつり' and e.get('date')=='2026-10-18' for e in events)
          corrected=[]
          for date in ['2026-10-17','2026-10-18']:
              event=old.copy()
              event.update(date=date,hall='その他',venues=['その他'],time='10:00〜16:00')
              corrected.append(event)
          events[i:i+1]=corrected
          data_path.write_text(json.dumps(events,ensure_ascii=False,indent=2),encoding='utf-8')
          meta_path=Path('update-meta.json')
          meta=json.loads(meta_path.read_text(encoding='utf-8'))
          assert meta['event_count']==len(events)-1, 'Metadata and old event count differ'
          meta['event_count']=len(events)
          meta_path.write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'Festival corrected: {len(events)-1} -> {len(events)} total events')
          PY
      - name: Validate date patterns, parser, live official page and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from types import SimpleNamespace
          import update_events as u

          for name in ['update_events.py','update_events_no_ocr.py','jr_walking_web.py']:
              compile(Path(name).read_text(encoding='utf-8'),name,'exec')
          variants=[
              '開催日 令和8年10月17日（土曜）、10月18日（日曜）',
              '開催日 令和8年10月17日（土曜）、18日（日曜）',
              '開催日 2026年10月17日（土曜）、10月18日（日曜）',
              '開催日 2026年10月17日、18日',
          ]
          for text in variants:
              actual=[d.isoformat() for d in u.expand_dates_from_text(text)]
              assert actual==['2026-10-17','2026-10-18'], (text,actual)
          print('PASS: Reiwa/Gregorian and abbreviated two-day dates')

          url='https://www.city.inazawa.aichi.jp/0000000913.html'
          festival_html='<html><h1>稲沢まつり</h1><h2>開催日</h2><p>令和8年10月17日（土曜）、10月18日（日曜）</p><h2>開催時間</h2><p>午前10時～午後4時</p><h2>開催場所</h2><p>国府宮参道、文化の丘公園、文化フォーラム</p><h3>他の開催日</h3><p>10月31日は準備日</p></html>'
          original_get=u.get
          try:
              u.get=lambda _:SimpleNamespace(text=festival_html)
              mocked=u.park_event_from_page(url,'city_event_calendar')
              assert [(e['date'],e['hall'],e['venues'],e['time']) for e in mocked]==[
                  ('2026-10-17','その他',['その他'],'10:00〜16:00'),
                  ('2026-10-18','その他',['その他'],'10:00〜16:00')],mocked
              park_html=festival_html.replace('<h1>稲沢まつり</h1>','<h1>文化の丘公園の別行事</h1>')
              u.get=lambda _:SimpleNamespace(text=park_html)
              park=u.park_event_from_page('https://www.city.inazawa.aichi.jp/0000009999.html','city_event_calendar')
              assert park and all(e['hall']=='文化の丘公園' for e in park)
          finally:
              u.get=original_get
          print('PASS: Festival is Other, other park events remain park, no unrelated date')

          live=u.park_event_from_page(url,'city_event_calendar')
          assert [(e['date'],e['hall'],e['time']) for e in live]==[
              ('2026-10-17','その他','10:00〜16:00'),
              ('2026-10-18','その他','10:00〜16:00')],live
          print('PASS: Live official festival page returned two correct dates and venue')

          events=json.loads(Path('events.json').read_text(encoding='utf-8'))
          meta=json.loads(Path('update-meta.json').read_text(encoding='utf-8'))
          stored=[e for e in events if e.get('title')=='稲沢まつり']
          assert [(e['date'],e['hall'],e['venues'],e['time'],e['official_url']) for e in stored]==[
              ('2026-10-17','その他',['その他'],'10:00〜16:00',url),
              ('2026-10-18','その他',['その他'],'10:00〜16:00',url)]
          assert len(events)==meta['event_count']
          assert [e for e in u.dedupe(events) if e['title']=='稲沢まつり']==stored
          print(f'PASS: Stored event data and metadata agree ({len(events)} events)')
          PY
          git diff --check
          python - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert files==['events.json','update-meta.json','update_events.py'], files
          print('PASS: Only event data, metadata count and updater code changed')
          PY
      - name: Commit correction to feature branch
        run: |
          git config user.name "forum-calendar-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add update_events.py events.json update-meta.json
          git commit -m "Correct Inazawa festival dates and classify as Other"
          git push origin HEAD:fix-inazawa-festival-dates-20260918
